# The player. Source of truth: the current revision's .blend (textures packed inside) and its manifests.
id = "cairo"
display_name = "Cairo"        # named on 29 September 2026 (earlier: Warm Original, and before that the yellow boy)
role = "player"
rig = "humanoid"                      # platform/conventions/rigs/humanoid.toml
rig_optional = ["fingers"]            # 23 core + 30 finger bones
height_cm = 148
revision = "game-r18"                 # r01-r17 stay in the prototype archive
source = "Cairo-Game-r18.blend"
source_prefix = "Cairo"               # promote.py names new revisions Cairo-<stage>-rNN.blend (the archive keeps WarmOriginal-*)
manifest = "source-manifest.json"     # every clip role with its reference, timing and contacts
clip_roles = 56
fps = 60
unreal_path = "/Game/Cairo"
see_through = ["M_Cairo"]             # his body fades near the camera (Scripts/see_through.py)
licence = "own; the sword attacks were retargeted from Mixamo motion, baked into the source (raw Mixamo files not included)"

# How pipeline/export.py makes his body (the defaults, a Tripo model's, are in pipeline/definition.py). By default it exports
# only the clips the merged move set takes from him (adventure.toml [donor]).
[export]
meshes = "outfit"                     # the dressed slots and the body regions the outfit leaves visible
mesh_names = [{ property = "outfit_slot" }, { property = "body_region" }]
measure = "evaluated-faces"           # loose vertices of the fitting body do not count
measure_pose = "Standing · outfit review"
actions = "authored"                  # his own clips, with their shape-key curves
strip_simulation = false
morph_names = "{slot}_{key}"
clips = { "Sprint · dressed" = "Sprint" }

[export.materials]
name = "M_{asset}_{source}"
texture = "T_{source}"
format = "png"
two_sided = "backface"
roughness = "shader"
metallic = "shader"
specular = "shader"

# How unreal/Scripts/import_character.py brings his body in (the defaults are in pipeline/definition.py).
[unreal]
camera_height = 35.0
vertex_colors = true
morph_targets = true                  # his outfit correctives and hair springs
contact_morphs = ["head_Hair_fore", "head_Hair_side"]   # the skin readers follow his hair springs

# Clips allowed above pipeline/fit.py's default bounds. A reach is how far a hand or foot falls short of its keyed grip,
# pedal or ground spot (the values when the gate was adopted are in the reasons).
[[fit]]
report = "bike"
clip = "BikeMount"
metric = "reach_foot_L_cm"
bound = 7.5
reason = "the left foot falls 7.02 cm short of its keyed target"

[[fit]]
report = "bike"
clip = "BikeKickstand"
metric = "reach_hand_L_cm"
bound = 7.75
reason = "the left hand falls 7.25 cm short of its keyed target"

[[fit]]
report = "bike"
clip = "BikeKickstand"
metric = "reach_foot_L_cm"
bound = 6.5
reason = "the left foot falls 6.03 cm short of its keyed target"

[[fit]]
report = "bike"
clip = "BikeCrash"
metric = "reach_hand_L_cm"
bound = 6.5
reason = "the left hand falls 5.81 cm short of its keyed target"

[[fit]]
report = "bike"
clip = "BikeCrash"
metric = "reach_hand_R_cm"
bound = 6.5
reason = "the right hand falls 6.07 cm short of its keyed target"
