# Modori, the rival (README.md). Source of truth: the current revision's .blend (textures packed) and its manifest.
# Playable: pipeline/export.py (with export_hooks.py, his coat), Scripts/import_character.py and the merged move set (adventure/retarget.py --character modori).
id = "modori"
display_name = "Modori"               # named on 7 October 2026 (earlier: the came-back take)
role = "player"                       # the rival in the story, playable in place of Cairo
rig = "mixamo"                        # Tripo's Mixamo skeleton (65 bones with fingers); the export renames it to the humanoid contract
height_cm = 175                       # the model is 1 m tall as Tripo exports it; scale to this on export
revision = "rig-r01"
source = "Modori-Rig-r01.blend"
manifest = "source-manifest.json"
licence = "own (Sunburst concept, Tripo mesh, rig and UV, texture and face painted here)"

# How pipeline/export.py makes his body (the defaults, a Tripo model's, are in pipeline/definition.py).
[export]
extra_bones = "drop"                  # Mixamo's end bones (finger tips, head top, toe ends) carry no weights
mesh_names = [{ group = "cloth_pin", name = "Coat" }, { name = "Body" }]
fbx = { colors_type = "LINEAR" }      # the coat's cloth mask travels as its vertex colour (export_hooks.py)

[export.materials]
two_sided = ["Coat"]

# How unreal/Scripts/import_character.py brings his body in (the defaults are in pipeline/definition.py).
[unreal]
vertex_colors = true                  # the coat's cloth mask
